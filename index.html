    <!-- Suppress Vite WebSocket/HMR reconnection errors per environment constraints -->
    <script>
      (function() {
        var isWsError = function(msg) {
          if (!msg) return false;
          var s = String(msg);
          return s.indexOf('WebSocket') !== -1 ||
                 s.indexOf('@vite/client') !== -1 ||
                 s.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
                 s.indexOf('ModuleRunner') !== -1;
        };

        window.addEventListener('error', function(e) {
          if (isWsError(e.message) || isWsError(e.filename) || (e.error && isWsError(e.error.message))) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (isWsError(e.reason)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
